# Üretim kurulumu (Ubuntu + Docker): PostgreSQL (pgvector) + uygulama.
# Kullanım: cp .env.example .env && (değerleri doldurun) && docker compose up -d --build
# Ayrıntılı adımlar: docs/KURULUM-UBUNTU.md
name: oftalmoakademi

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: oftalmoakademi
      POSTGRES_USER: oftalmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oftalmo -d oftalmoakademi"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Dış dünyaya port açılmaz; yalnızca uygulama erişir.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # .env'deki tüm değişkenler (Gemini, Anthropic, NCBI, ilk yönetici …) uygulamaya aktarılır;
    # aşağıdaki "environment" değerleri .env'dekilerin önüne geçer.
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://oftalmo:${POSTGRES_PASSWORD}@db:5432/oftalmoakademi
      APP_URL: ${APP_URL:?APP_URL gerekli (https://alan-adiniz)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY gerekli}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Tek uygulama kapsayıcısı: haftalık PubMed taraması uygulama içinde çalışır
      ARTICLE_SCAN_SCHEDULER: ${ARTICLE_SCAN_SCHEDULER:-1}
    volumes:
      - appdata:/app/data # STORAGE_DRIVER=local ise yüklenen dosyalar /app/data/storage altında
    ports:
      - "127.0.0.1:3000:3000" # Yalnızca ters vekil (Caddy/Nginx, TLS) üzerinden yayınlayın
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/giris || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  appdata:
